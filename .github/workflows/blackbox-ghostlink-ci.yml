name: BLACKBOX GHOSTLINK source and release CI
on:
  push:
    branches: [main]
    paths:
      - 'projects/blackbox-ghostlink/**'
      - 'releases/BLACKBOX_GHOSTLINK_v0.4.0.zip'
      - '.github/workflows/blackbox-ghostlink-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/blackbox-ghostlink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install map-preparation test dependency
        run: python3 -m pip install 'Pillow>=11,<13'
      - name: Verify checked-in source hashes
        run: python3 tools/verify_integrity.py
      - name: Run all software and map tests
        run: python3 -m unittest discover -s tests -q
      - name: Static syntax checks
        run: |
          python3 -m compileall -q app.py radio_bridge.py deploy offline tools tests
          node --check app.js
          bash -n deploy/install_jetson.sh
      - name: Verify downloadable source ZIP and source parity
        run: |
          python3 - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path
          zippath=Path('../../releases/BLACKBOX_GHOSTLINK_v0.4.0.zip')
          checksum=Path('../../releases/BLACKBOX_GHOSTLINK_v0.4.0.zip.sha256').read_text().split()[0]
          assert hashlib.sha256(zippath.read_bytes()).hexdigest()==checksum,'ZIP checksum mismatch'
          with zipfile.ZipFile(zippath) as z:
              assert z.testzip() is None
              lines=z.read('blackbox_ghostlink/SHA256SUMS').decode().splitlines()
              for line in lines:
                  sha,relative=line.split('  ',1)
                  assert hashlib.sha256(z.read('blackbox_ghostlink/'+relative)).hexdigest()==sha,relative
                  assert hashlib.sha256(Path(relative).read_bytes()).hexdigest()==sha,relative
          print('PASS: release ZIP byte-for-byte matches committed source')
          PY
